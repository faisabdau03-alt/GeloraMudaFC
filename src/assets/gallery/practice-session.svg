<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gPracBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1E2E" />
      <stop offset="60%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#070A0F" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#gPracBg)" />
  <!-- Sunset golden horizon line -->
  <line x1="0" y1="280" x2="600" y2="280" stroke="#F59E0B" stroke-width="1.5" opacity="0.4" />
  <!-- Training Cones on Grass -->
  <polygon points="120,320 128,300 136,320" fill="#EA580C" />
  <polygon points="220,320 228,300 236,320" fill="#EA580C" />
  <polygon points="320,320 328,300 336,320" fill="#EA580C" />
  <polygon points="420,320 428,300 436,320" fill="#EA580C" />
  <!-- Training ladder agility marks -->
  <line x1="100" y1="330" x2="450" y2="330" stroke="#FFE885" stroke-width="2" opacity="0.6" stroke-dasharray="15, 10" />
  <!-- Coach & players running drills -->
  <g transform="translate(260, 160)">
    <!-- Runner player -->
    <circle cx="50" cy="40" r="14" fill="#FFE885" />
    <path d="M 40 55 L 60 55 L 75 90 L 95 110 L 60 95 L 45 130 L 30 115 L 45 85 Z" fill="#0D6EFD" />
  </g>
  <!-- Footballs in a net/rack -->
  <circle cx="480" cy="305" r="14" fill="#FFF" stroke="#0D6EFD" stroke-width="2" />
  <circle cx="505" cy="312" r="12" fill="#FFF" stroke="#0D6EFD" stroke-width="2" />
  <!-- Caption banner -->
  <rect x="20" y="340" width="160" height="26" rx="4" fill="#0B0E14" stroke="#D4AF37" stroke-width="1" opacity="0.85" />
  <text x="100" y="357" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFE885" text-anchor="middle">LATIHAN FISIK & TAKTIK</text>
</svg>

