<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gTrBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A365D" />
      <stop offset="50%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>
    <linearGradient id="goldCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <radialGradient id="trGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0D6EFD" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#gTrBg)" />
  <circle cx="300" cy="180" r="150" fill="url(#trGlow)" />
  <!-- Spotlight beams -->
  <polygon points="100,0 260,240 220,240" fill="#FFE885" opacity="0.1" />
  <polygon points="500,0 340,240 380,240" fill="#FFE885" opacity="0.1" />
  <!-- Trophy in center -->
  <g transform="translate(240, 70)">
    <!-- Base -->
    <rect x="25" y="195" width="70" height="25" rx="3" fill="#18181B" stroke="url(#goldCup)" stroke-width="2" />
    <rect x="35" y="180" width="50" height="15" fill="url(#goldCup)" />
    <!-- Stem -->
    <path d="M 50 140 L 70 140 L 65 180 L 55 180 Z" fill="url(#goldCup)" />
    <!-- Cup body -->
    <path d="M 30 50 C 30 140 90 140 90 50 Z" fill="url(#goldCup)" />
    <!-- Cup Handles -->
    <path d="M 30 65 C 5 65 5 110 32 110" fill="none" stroke="url(#goldCup)" stroke-width="8" stroke-linecap="round" />
    <path d="M 90 65 C 115 65 115 110 88 110" fill="none" stroke="url(#goldCup)" stroke-width="8" stroke-linecap="round" />
    <!-- Blue ribbon hanging on trophy -->
    <path d="M 52 100 L 45 160 L 55 150 L 65 160 L 58 100 Z" fill="#0D6EFD" stroke="#FFE885" stroke-width="1" />
  </g>
  <!-- Caption banner -->
  <rect x="20" y="340" width="190" height="26" rx="4" fill="#0B0E14" stroke="#D4AF37" stroke-width="1" opacity="0.85" />
  <text x="115" y="357" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFE885" text-anchor="middle">TROFI & PRESTASI LOKAL</text>
</svg>
