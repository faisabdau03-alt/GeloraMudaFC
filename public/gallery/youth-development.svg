<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gYthBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071829" />
      <stop offset="60%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#03060C" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#gYthBg)" />
  <!-- Goal Post in Background -->
  <path d="M 120 310 L 120 180 L 480 180 L 480 310" stroke="#FFFFFF" stroke-width="6" fill="none" opacity="0.4" />
  <line x1="120" y1="180" x2="160" y2="150" stroke="#FFF" stroke-width="4" opacity="0.3" />
  <line x1="480" y1="180" x2="440" y2="150" stroke="#FFF" stroke-width="4" opacity="0.3" />
  <!-- Net mesh grid -->
  <g opacity="0.1" stroke="#FFF" stroke-width="1">
    <line x1="160" y1="190" x2="440" y2="190" />
    <line x1="140" y1="230" x2="460" y2="230" />
    <line x1="130" y1="270" x2="470" y2="270" />
    <line x1="200" y1="180" x2="200" y2="310" />
    <line x1="280" y1="180" x2="280" y2="310" />
    <line x1="360" y1="180" x2="360" y2="310" />
    <line x1="420" y1="180" x2="420" y2="310" />
  </g>
  <!-- Young player receiving instruction from senior captain/coach -->
  <g transform="translate(220, 180)">
    <!-- Senior Captain / Coach -->
    <circle cx="60" cy="30" r="14" fill="#D4AF37" />
    <rect x="46" y="47" width="28" height="75" rx="3" fill="#0D6EFD" />
    <!-- Young player -->
    <circle cx="120" cy="50" r="11" fill="#D4AF37" />
    <rect x="110" y="63" width="20" height="58" rx="3" fill="#1E293B" stroke="#0D6EFD" stroke-width="1.5" />
    <!-- Ball at feet -->
    <circle cx="100" cy="120" r="10" fill="#FFF" stroke="#D4AF37" stroke-width="1.5" />
  </g>
  <!-- Pitch line -->
  <line x1="0" y1="310" x2="600" y2="310" stroke="#10B981" stroke-width="2" opacity="0.5" />
  <!-- Caption banner -->
  <rect x="20" y="340" width="190" height="26" rx="4" fill="#0B0E14" stroke="#D4AF37" stroke-width="1" opacity="0.85" />
  <text x="115" y="357" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFE885" text-anchor="middle">PEMBINAAN TALENTA MUDA</text>
</svg>
