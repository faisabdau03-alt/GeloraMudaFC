<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gCelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2445" />
      <stop offset="50%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>
    <radialGradient id="goldSunburst" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0B0E14" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#gCelBg)" />
  <circle cx="300" cy="180" r="160" fill="url(#goldSunburst)" />
  <!-- Confetti / Gold sparks -->
  <circle cx="150" cy="80" r="3" fill="#FFE885" opacity="0.8" />
  <circle cx="220" cy="60" r="2" fill="#38BDF8" opacity="0.7" />
  <circle cx="340" cy="50" r="3" fill="#FFE885" opacity="0.9" />
  <circle cx="420" cy="75" r="2.5" fill="#38BDF8" opacity="0.8" />
  <circle cx="480" cy="110" r="2" fill="#FFE885" opacity="0.6" />
  <!-- Silhouettes of players embracing in celebration -->
  <g transform="translate(140, 110)">
    <!-- Player 1 arms raised -->
    <path d="M 60 70 C 60 50 70 35 80 35 C 90 35 100 50 100 70 Z" fill="#FFE885" />
    <path d="M 50 20 L 70 80 L 100 80 L 120 20 L 105 15 L 90 60 L 80 60 L 65 15 Z" fill="#0D6EFD" />
    <rect x="70" y="80" width="30" height="90" fill="#0D6EFD" />
    <!-- Player 2 embrace -->
    <path d="M 120 80 C 120 60 130 45 140 45 C 150 45 160 60 160 80 Z" fill="#FFE885" />
    <rect x="125" y="80" width="35" height="90" fill="#0A1833" stroke="#D4AF37" stroke-width="1.5" />
    <!-- Player 3 jumping -->
    <path d="M 190 70 C 190 50 200 35 210 35 C 220 35 230 50 230 70 Z" fill="#FFE885" />
    <path d="M 180 20 L 200 80 L 230 80 L 250 20 L 235 15 L 220 60 L 210 60 L 195 15 Z" fill="#0D6EFD" />
    <rect x="200" y="80" width="30" height="90" fill="#0D6EFD" />
  </g>
  <!-- Field line -->
  <line x1="0" y1="320" x2="600" y2="320" stroke="#0D6EFD" stroke-width="2" opacity="0.5" />
  <!-- Caption banner -->
  <rect x="20" y="340" width="180" height="26" rx="4" fill="#0B0E14" stroke="#0D6EFD" stroke-width="1" opacity="0.85" />
  <text x="110" y="357" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">SELEBRASI GOL PENENTU</text>
</svg>
